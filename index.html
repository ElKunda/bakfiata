<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Invités - Mariage</title>
    <!-- Tailwind CSS pour un design propre et rapide -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold text-indigo-900">💍 Gestion des Invités</h1>
                <p class="text-sm text-gray-600">Interface connectée à Supabase (Tables & Invités)</p>
            </div>
            <div class="flex gap-2">
                <button onclick="openTableManager()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow font-medium transition">
                    Gérer la liste des tables
                </button>
            </div>
        </header>

        <!-- Tableau des invités -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden mb-10">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-xl font-semibold text-gray-800">Liste des Invités</h2>
                <span id="guest-count" class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">0 invité(s)</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider">
                            <th class="py-3 px-4">Civilité & Nom</th>
                            <th class="py-3 px-4">Table</th>
                            <th class="py-3 px-4">Présent</th>
                            <th class="py-3 px-4">Boisson</th>
                            <th class="py-3 px-4">Chansons / Message</th>
                            <th class="py-3 px-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="guests-table-body" class="divide-y divide-gray-200 text-sm">
                        <!-- Les invités seront injectés ici dynamiquement -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODALE DE MODIFICATION D'UN INVITÉ -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg max-w-lg w-full p-6 shadow-xl">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Modifier l'invité</h3>
            <form id="edit-guest-form" onsubmit="handleUpdateGuest(event)" class="space-y-4">
                <input type="hidden" id="edit-id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Civilité</label>
                        <input type="text" id="edit-civilite" class="mt-1 w-full border border-gray-300 rounded-md p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Nom complet</label>
                        <input type="text" id="edit-nom-complet" required class="mt-1 w-full border border-gray-300 rounded-md p-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Table assignée</label>
                    <select id="edit-table-select" class="mt-1 w-full border border-gray-300 rounded-md p-2 text-sm">
                        <!-- Options de tables chargées dynamiquement -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Présence</label>
                    <select id="edit-present" class="mt-1 w-full border border-gray-300 rounded-md p-2 text-sm">
                        <option value="true">Présent(e)</option>
                        <option value="false">Absent(e)</option>
                        <option value="">Non renseigné</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Boisson</label>
                    <input type="text" id="edit-boisson" class="mt-1 w-full border border-gray-300 rounded-md p-2 text-sm">
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Chanson 1</label>
                        <input type="text" id="edit-chanson-1" class="mt-1 w-full border border-gray-300 rounded-md p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Chanson 2</label>
                        <input type="text" id="edit-chanson-2" class="mt-1 w-full border border-gray-300 rounded-md p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Chanson 3</label>
                        <input type="text" id="edit-chanson-3" class="mt-1 w-full border border-gray-300 rounded-md p-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Message</label>
                    <textarea id="edit-message" rows="2" class="mt-1 w-full border border-gray-300 rounded-md p-2 text-sm"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('edit-modal')" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-300">Annuler</button>
                    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-indigo-700">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODALE DE GESTION DES TABLES -->
    <div id="table-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg max-w-md w-full p-6 shadow-xl">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Gestion des Tables (`table_list`)</h3>
            
            <!-- Formulaire d'ajout de table -->
            <form onsubmit="handleAddNewTable(event)" class="flex gap-2 mb-4">
                <input type="text" id="new-table-name" placeholder="Nom de la nouvelle table..." required class="flex-1 border border-gray-300 rounded-md p-2 text-sm">
                <button type="submit" class="bg-green-600 text-white px-3 py-2 rounded-md text-sm font-medium hover:bg-green-700">Ajouter</button>
            </form>

            <!-- Liste des tables existantes -->
            <div class="border border-gray-200 rounded-md max-h-60 overflow-y-auto mb-4 p-2" id="tables-list-container">
                <!-- Injection dynamique des tables -->
            </div>

            <div class="flex justify-end">
                <button type="button" onclick="closeModal('table-modal')" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-300">Fermer</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS SUPABASE & LOGIQUE -->
    <script>
        // REMPLACEZ CES VALEURS PAR VOS VRAIES CLÉS SUPABASE
        const SUPABASE_URL = 'VOTRE_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'VOTRE_SUPABASE_ANON_KEY';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Chargement initial
        document.addEventListener('DOMContentLoaded', () => {
            loadGuests();
        });

        // 1. Récupérer et afficher les invités (avec relation table_list)
        async function loadGuests() {
            const { data: guests, error } = await supabase
                .from('guest')
                .select(`
                    *,
                    table_list (
                        id,
                        nom_table
                    )
                `)
                .order('nom_complet', { ascending: true });

            if (error) {
                console.error("Erreur chargement invités:", error);
                alert("Erreur lors du chargement des invités.");
                return;
            }

            const tbody = document.getElementById('guests-table-body');
            document.getElementById('guest-count').textContent = `${guests.length} invité(s)`;
            tbody.innerHTML = '';

            guests.forEach(guest => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50';
                
                const tableName = guest.table_list ? guest.table_list.nom_table : '<span class="text-gray-400 italic">Non assignée</span>';
                let presentBadge = '<span class="px-2 py-1 text-xs rounded bg-gray-100 text-gray-600">Inconnu</span>';
                if (guest.present === true) presentBadge = '<span class="px-2 py-1 text-xs rounded bg-green-100 text-green-800 font-semibold">Présent</span>';
                if (guest.present === false) presentBadge = '<span class="px-2 py-1 text-xs rounded bg-red-100 text-red-800 font-semibold">Absent</span>';

                tr.innerHTML = `
                    <td class="py-3 px-4">
                        <div class="font-medium text-gray-900">${guest.nom_complet}</div>
                        <div class="text-xs text-gray-500">${guest.civilite || ''}</div>
                    </td>
                    <td class="py-3 px-4">${tableName}</td>
                    <td class="py-3 px-4">${presentBadge}</td>
                    <td class="py-3 px-4 text-gray-600">${guest.boisson || '-'}</td>
                    <td class="py-3 px-4 text-xs text-gray-500 max-w-xs truncate">
                        ${guest.chanson_1 ? '🎵 ' + guest.chanson_1 : ''}
                        ${guest.message ? '<br>💬 ' + guest.message : ''}
                    </td>
                    <td class="py-3 px-4 text-center">
                        <button onclick='openEditModal(${JSON.stringify(guest)})' class="text-indigo-600 hover:text-indigo-900 font-medium text-xs bg-indigo-50 px-2.5 py-1.5 rounded">Modifier</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 2. Charger les options du menu déroulant des tables
        async function loadTablesDropdown(selectedTableId = null) {
            const { data: tables, error } = await supabase
                .from('table_list')
                .select('*')
                .order('nom_table', { ascending: true });

            if (error) {
                console.error("Erreur tables:", error);
                return;
            }

            const select = document.getElementById('edit-table-select');
            select.innerHTML = '<option value="">-- Aucune table --</option>';

            tables.forEach(table => {
                const option = document.createElement('option');
                option.value = table.id;
                option.textContent = table.nom_table;
                if (table.id === selectedTableId) {
                    option.selected = true;
                }
                select.appendChild(option);
            });
        }

        // 3. Ouvrir la modale d'édition d'un invité
        async function openEditModal(guest) {
            document.getElementById('edit-id').value = guest.id;
            document.getElementById('edit-civilite').value = guest.civilite || '';
            document.getElementById('edit-nom-complet').value = guest.nom_complet || '';
            document.getElementById('edit-present').value = guest.present === null ? "" : String(guest.present);
            document.getElementById('edit-boisson').value = guest.boisson || '';
            document.getElementById('edit-chanson-1').value = guest.chanson_1 || '';
            document.getElementById('edit-chanson-2').value = guest.chanson_2 || '';
            document.getElementById('edit-chanson-3').value = guest.chanson_3 || '';
            document.getElementById('edit-message').value = guest.message || '';

            await loadTablesDropdown(guest.table_id);
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        // 4. Soumettre la modification de l'invité
        async function handleUpdateGuest(event) {
            event.preventDefault();
            const id = document.getElementById('edit-id').value;
            const tableIdVal = document.getElementById('edit-table-select').value;
            const presentVal = document.getElementById('edit-present').value;

            const formData = {
                civilite: document.getElementById('edit-civilite').value,
                nom_complet: document.getElementById('edit-nom-complet').value,
                table_id: tableIdVal ? parseInt(tableIdVal) : null,
                present: presentVal === "" ? null : presentVal === "true",
                boisson: document.getElementById('edit-boisson').value,
                chanson_1: document.getElementById('edit-chanson-1').value,
                chanson_2: document.getElementById('edit-chanson-2').value,
                chanson_3: document.getElementById('edit-chanson-3').value,
                message: document.getElementById('edit-message').value
            };

            const { error } = await supabase
                .from('guest')
                .update(formData)
                .eq('id', id);

            if (error) {
                console.error("Erreur mise à jour:", error);
                alert("Erreur lors de la mise à jour de l'invité.");
            } else {
                closeModal('edit-modal');
                loadGuests();
            }
        }

        // 5. Gestionnaire de la liste des tables (table_list)
        async function openTableManager() {
            await renderTablesList();
            document.getElementById('table-modal').classList.remove('hidden');
        }

        async function renderTablesList() {
            const { data: tables, error } = await supabase
                .from('table_list')
                .select('*')
                .order('nom_table', { ascending: true });

            if (error) {
                console.error("Erreur:", error);
                return;
            }

            const container = document.getElementById('tables-list-container');
            container.innerHTML = '';

            if (tables.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400 text-center py-2">Aucune table enregistrée.</p>';
                return;
            }

            tables.forEach(table => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between py-1.5 border-b border-gray-100 last:border-0 text-sm';
                div.innerHTML = `
                    <span class="font-medium text-gray-700">${table.nom_table}</span>
                    <div class="flex gap-2">
                        <button onclick="renameTablePrompt(${table.id}, '${table.nom_table.replace(/'/g, "\\'")}')" class="text-blue-600 hover:text-blue-800 text-xs bg-blue-50 px-2 py-1 rounded">Renommer</button>
                        <button onclick="deleteTable(${table.id})" class="text-red-600 hover:text-red-800 text-xs bg-red-50 px-2 py-1 rounded">Supprimer</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function handleAddNewTable(event) {
            event.preventDefault();
            const input = document.getElementById('new-table-name');
            const nom_table = input.value.trim();
            if (!nom_table) return;

            const { error } = await supabase
                .from('table_list')
                .insert([{ nom_table }]);

            if (error) {
                alert("Erreur lors de l'ajout (peut-être que ce nom de table existe déjà).");
                console.error(error);
            } else {
                input.value = '';
                renderTablesList();
            }
        }

        async function renameTablePrompt(id, currentName) {
            const nouveauNom = prompt("Modifier le nom de la table :", currentName);
            if (nouveauNom && nouveauNom.trim() !== "" && nouveauNom !== currentName) {
                const { error } = await supabase
                    .from('table_list')
                    .update({ nom_table: nouveauNom.trim() })
                    .eq('id', id);

                if (error) {
                    alert("Erreur lors du renommage.");
                } else {
                    renderTablesList();
                    loadGuests(); // Recharge pour afficher le nouveau nom instantanément
                }
            }
        }

        async function deleteTable(id) {
            if (confirm("Voulez-vous vraiment supprimer cette table ? (Attention: les invités qui y étaient rattachés perdront leur assignation de table)")) {
                const { error } = await supabase
                    .from('table_list')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert("Erreur lors de la suppression (vérifiez qu'aucun invité n'y est lié ou que les contraintes le permettent).");
                } else {
                    renderTablesList();
                    loadGuests();
                }
            }
        }

        // Utilitaires modales
        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }
    </script>
</body>
</html>
